<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sääsivu (© Saara Heikkilä.)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
    <!--navigation-->
        <header>
            <nav class="navbar">
                <div class="nav-brand">Sääsovellus</div>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">Etusivu</a></li>
                    <li><a href="forecast.html">Ennuste</a></li>
                    <li><a href="tamk.html">Tamk</a></li>
                    <li><a href="about.html">Tietoa sivusta</a></li>
                </ul>
            </nav>
        </header>
        <!--navigation end-->
        <div class="top-row">
            <div class="weather-col">
                <h2 class="section-heading">Nykyinen sää</h2>
                <section class="weather-card" aria-label="Weather card">
                    <form id="search-form" class="search" role="search" aria-label="Hae kaupunki">
                        <label class="sr-only" for="city-input">Kaupunki</label>
                        <input id="city-input" type="text" placeholder="Hae kaupunki...">
                        <button id="search-button" type="submit">Hae</button>
                        <button id="locate-btn" type="button">📍 Paikanna</button>
                    </form>
                    <p class="unavailable" id="location-error"></p>
                    <div class="weather-main">
                        <div>
                            <div id="city-name" class="location">—</div>
                            <div id="temperature" class="temp">—°C</div>
                            <div id="feels-like" class="feels-like">—°C</div>
                            <div id="humidity" class="humidity">Kosteus: —%</div>
                            <div id="wind-speed" class="wind">Tuuli: — m/s</div>
                            <div id="weather-description" class="desc">Ei saatavilla</div>
                        </div>
                    </div>
                    <div class="weather-footer">
                        <div class="info">Päivitetty: —</div>
                        <div class="attribution">Säädata: Open Weather API</div>
                    </div>
                </section>
            </div>
        </div>
        <footer class="footer">
            <div class="footer-content">
                <span>Sääsovellus</span>
                <span>Sääsivu (Saara H.)</span>
            </div>
        </footer>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
